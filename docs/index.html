s center-clock-opacity { from { opacity: 0; } to { opacity: 1; } }\n@keyframes center-label-opacity {\n  from { visibility: visible; opacity: 0; }\n  to { visibility: visible; opacity: 1; }\n}\n@media (prefers-reduced-motion: reduce) {\n  body[data-screen=\"center\"] #timer .finish-clock,\n  body[data-screen=\"center\"] #timer .finish-label { animation: none; }\n}\r\n/* Paused output cue */\n.pause-message { display: none; }\nbody[data-status=\"paused\"] #timer:not(.finish-out) #digits { visibility: hidden; }\nbody[data-status=\"paused\"] #timer:not(.finish-out) .pause-message {\n  position: absolute;\n  inset: 0;\n  z-index: 3;\n  display: grid;\n  place-items: center;\n  color: #f0b90b;\n  font: 900 10cqw/1 CountdownGotham, Display, sans-serif;\n  letter-spacing: .08em;\n}\n.pause-lockup { display: flex; align-items: center; gap: .5em; }\nbody[data-screen=\"left\"] #timer.solo .pause-message { font-size: 15cqw; }\nbody[data-screen=\"left\"] #timer.solo .pause-lockup { flex-direction: column; gap: .5em; }\n.pause-icon {\n  display: grid;\n  grid-template-columns: repeat(2,.27em);\n  gap: .17em;\n  filter: drop-shadow(0 0 .18em #f0b90b66);\n}\n.pause-icon::before, .pause-icon::after {\n  content: \"\";\n  height: .82em;\n  border-radius: .05em;\n  background: currentColor;\n}\n#timer .clock-box .pause-label { font: inherit; letter-spacing: inherit; color: inherit; }\nbody[data-screen=\"left\"][data-status=\"paused\"] #timer.solo .clock-box::before,\nbody[data-screen=\"left\"][data-status=\"paused\"] #timer.solo .clock-box::after { display: none; }\n\n#timer.solo #digits,.clock-box #digits{font-family:Arial Black,Arial,sans-serif;font-weight:900}\u003c/style>\u003c/head>\u003cbody>\u003cmain id=\"screen\">\u003cimg id=\"scene\" alt=\"\">\u003cdiv id=\"timer\">\u003cdiv class=\"brand\">\u003csvg viewBox=\"0 0 48 48\" aria-hidden=\"true\">\u003cpath d=\"m24 0 10 10-6 6-4-4-4 4-6-6ZM10 14l6 6-4 4 4 4-6 6L0 24Zm28 0 10 10-10 10-6-6 4-4-4-4ZM24 18l6 6-6 6-6-6Zm-4 14 4 4 4-4 6 6-10 10-10-10Z\"/>\u003c/svg>\u003cspan>BINANCE\u003c/span>\u003c/div>\u003cdiv class=\"clock-box\">\u003cspan id=\"digits\">00:00\u003c/span>\u003cdiv class=\"pause-message\">\u003cdiv class=\"pause-lockup\">\u003ci class=\"pause-icon\" aria-hidden=\"true\">\u003c/i>\u003cspan class=\"pause-label\">PAUSED\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"finish-message\">\u003cdiv class=\"finish-lockup\">\u003ci class=\"finish-clock\" aria-hidden=\"true\">\u003c/i>\u003cspan class=\"finish-label\">TIME’S UP\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/main>\u003cscript>function formatTime(ms,precise=false){const n=Math.max(0,Math.floor(ms)),s=precise?Math.floor(n/1000):Math.max(0,Math.ceil(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return(h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0')+(precise?'.'+String(n%1000).padStart(3,'0'):'')}\n\nclass SharedClock extends EventTarget {\n  constructor() {\n    super();\n    const update = () => {\n      this.state = parent.demoState();\n      this.dispatchEvent(new Event('state'));\n    };\n    parent.registerDemoScreen(update);\n  }\n  now() { return parent.performance.now(); }\n  remaining() { return parent.demoRemaining(); }\n}const side=parent.demoScreen(frameElement.id),dim={left:[800,1400],center:[1920,1080],right:[800,1400]}[side],preview=new URLSearchParams(location.search).has('preview');if(preview)document.body.classList.add('preview');document.title='Timer · '+side.toUpperCase()+' · '+dim.join(' × ');const screen=document.querySelector('#screen'),timer=document.querySelector('#timer'),digits=document.querySelector('#digits'),scene=document.querySelector('#scene');screen.style.width=dim[0]+'px';screen.style.height=dim[1]+'px';function resize(){const s=Math.min(innerWidth/dim[0],innerHeight/dim[1]);screen.style.transform=`scale(${s})`;screen.style.left=(innerWidth-dim[0]*s)/2+'px';screen.style.top=(innerHeight-dim[1]*s)/2+'px'}resize();addEventListener('resize',resize);\ndocument.body.dataset.screen=side;\nlet wasVisible=false,entrance;\nfunction animateIn(){entrance?.cancel();entrance=timer.animate([{opacity:0,transform:'translateY(26px) scale(.94)',filter:'blur(7px)'},{opacity:1,transform:'translateY(-3px) scale(1.015)',filter:'blur(0px)',offset:.74},{opacity:1,transform:'scale(1)',filter:'blur(0px)'}],{duration:matchMedia('(prefers-reduced-motion: reduce)').matches?100:780,easing:'cubic-bezier(.16,1,.3,1)'});}\nconst clock=new SharedClock(side,preview);let sceneID='';clock.addEventListener('state',()=>{const s=clock.state,p=s.layouts[side];timer.style.left=p.x+'px';timer.style.top=p.y+'px';timer.style.width=p.width+'px';timer.style.visibility=p.visible?'visible':'hidden';if(p.visible&&!wasVisible)animateIn();wasVisible=p.visible;document.querySelector('.brand').style.display=s.showLogo?'flex':'none';if(s.scene!==sceneID){sceneID=s.scene;if(s.scene==='transparent'){scene.style.display='none';scene.removeAttribute('src')}else{scene.src='/scene/'+encodeURIComponent(s.scene)+'/'+side;scene.style.display='block'}}});\ndigits.innerHTML='\u003cspan class=\"whole\">\u003c/span>\u003csmall class=\"fraction\">\u003c/small>';const whole=digits.querySelector('.whole'),fraction=digits.querySelector('.fraction'),box=document.querySelector('.clock-box');\nif(side==='center'){const stroke=document.createElementNS('http://www.w3.org/2000/svg','svg');stroke.setAttribute('class','edge-light');stroke.setAttribute('aria-hidden','true');stroke.innerHTML='\u003crect class=\"edge-base\"/>\u003crect class=\"edge-trail\" pathLength=\"100\"/>\u003crect class=\"edge-head\" pathLength=\"100\"/>';box.append(stroke);const fit=()=>{const w=box.clientWidth,h=box.clientHeight,r=parseFloat(getComputedStyle(box).borderRadius);stroke.setAttribute('viewBox','0 0 '+w+' '+h);stroke.querySelectorAll('rect').forEach(el=>{for(const [k,v]of Object.entries({x:1.5,y:1.5,width:w-3,height:h-3,rx:Math.max(0,r-1.5)}))el.setAttribute(k,v)})};new ResizeObserver(fit).observe(box);fit();}\nlet landing;\nfunction landFinalDigit() {\n  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n  landing?.cancel();\n  landing = digits.animate([\n    { transform: 'scale(1.42)', opacity: .45, easing: 'cubic-bezier(.5,.05,.85,.45)' },\n    { transform: 'scale(.96)', opacity: 1, offset: .48, easing: 'ease-out' },\n    { transform: 'scale(1.02)', opacity: 1, offset: .73 },\n    { transform: 'scale(1)', opacity: 1 }\n  ], { duration: 430 });\n}\nlet previous='';function draw(){if(clock.state){const ms=clock.remaining(),precise=ms\u003c=300000,solo=side==='left'&&ms\u003c=30000,str=solo?String(Math.floor(ms/1000)):formatTime(ms,precise),urgent=ms>0&&ms\u003c=30000;timer.classList.toggle('solo',solo);timer.classList.toggle('two-digits',solo&&ms>=10000);const motionTime=clock.state.status==='running'?clock.now():clock.state.remainingMs;timer.style.setProperty('--light-pos',(50-50*Math.cos((motionTime%3200)*Math.PI/1600))+'%');timer.style.setProperty('--orbit',(motionTime%3600)/10+'deg');timer.style.setProperty('--number-pop',String(1+.035*Math.pow((ms%1000)/1000,6)));if(str!==previous){landing?.cancel();if(solo&&ms>=1000&&ms\u003c11000&&clock.state.status==='running')landFinalDigit();const parts=str.split('.');whole.textContent=parts[0];whole.dataset.value=parts[0];fraction.textContent=parts[1]?'.'+parts[1]:'';previous=str;box.classList.toggle('long',parts[0].length>5);box.classList.toggle('milliseconds',precise)}timer.classList.toggle('warning',ms>0&&ms\u003c=clock.state.warningSeconds*1000);timer.classList.toggle('finished',ms===0);timer.classList.toggle('finish-out',ms===0&&(clock.state.status==='running'||clock.state.status==='finished'));timer.classList.toggle('final',urgent);timer.classList.toggle('paused',clock.state.status!=='running');timer.style.setProperty('--edge-offset',String(-(clock.now()%3200)/32));const phase=(clock.now()%1800)/1800,beat=(1-Math.cos(phase*Math.PI*2))/2;timer.style.setProperty('--beat',urgent?beat.toFixed(3):'0');timer.style.setProperty('--sweep',((clock.now()%2400)/24).toFixed(2)+'%');document.body.dataset.phase=ms===0?'finished':urgent?'final30':precise?'precision':'normal';document.body.dataset.status=clock.state.status;document.body.dataset.revision=clock.state.revision}requestAnimationFrame(draw)}draw();window.timerClock=clock;\n\u003c/script>\u003c/body>\u003c/html>\n\r\n";
if(standalone){
  document.documentElement.classList.add('output');
  const frame=document.querySelector('#'+screenMode);
  document.body.replaceChildren(frame);
  frame.srcdoc=output;
}else{
  document.querySelectorAll('iframe').forEach(frame=>{frame.srcdoc=output});
  const play=document.querySelector('#play'),pause=document.querySelector('#pause'),notice=document.querySelector('#notice');
  play.onclick=()=>{if(status!=='paused')held=duration;deadline=performance.now()+held;status='running';refresh()};
  pause.onclick=()=>{if(status==='running'){held=window.demoRemaining();status='paused';refresh()}};
  document.querySelector('#reset').onclick=()=>{held=duration;status='ready';refresh()};
  const urls={};
  const names={side:'Side',center:'Center'};
  document.querySelector('#make-links').onclick=()=>{
    const start=Date.now()+60000;
    for(const screen of Object.keys(names)){
      const url=new URL(location.href);
      url.search='';url.hash='';
      url.searchParams.set('out',screen);url.searchParams.set('start',String(start));
      urls[screen]=url.href;
      document.querySelector('#copy-'+screen).disabled=false;
    }
    notice.textContent='Both links start the same 35-second run at '+new Date(start).toLocaleTimeString()+'. Copy them into your Browser Sources before then.';
  };
  for(const screen of Object.keys(names)){
    document.querySelector('#copy-'+screen).onclick=async()=>{
      try{await navigator.clipboard.writeText(urls[screen]);notice.textContent=names[screen]+' link copied.'}
      catch{notice.textContent=urls[screen]}
    };
  }
}
function refresh(){
  screens.forEach(update=>update());
  if(standalone)return;
  const play=document.querySelector('#play');
  play.textContent=status==='paused'?'▶ Resume':status==='ready'?'▶ Start 35-second demo':'↻ Replay 35-second demo';
  document.querySelector('#pause').disabled=status!=='running';
}
let lastStatus=window.demoState().status;
setInterval(()=>{
  if(!standalone&&status==='running'&&window.demoRemaining()===0){held=0;status='finished'}
  const next=window.demoState().status;
  if(next!==lastStatus){lastStatus=next;refresh()}
},50);
